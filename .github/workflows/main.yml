name: Build unsigned IPA

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Build AirLift Rust core (aarch64-apple-ios)
        env:
          IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        run: |
          rustup target add aarch64-apple-ios
          cd WorkPlot/AirLift/RustCore
          cargo build --release --target aarch64-apple-ios

      - name: Package AirliftFFI.xcframework
        run: |
          rm -rf WorkPlot/AirLift/RustCore/AirliftFFI.xcframework
          xcodebuild -create-xcframework \
            -library WorkPlot/AirLift/RustCore/target/aarch64-apple-ios/release/libairlift_ffi.a \
            -headers WorkPlot/AirLift/RustCore/include \
            -output WorkPlot/AirLift/RustCore/AirliftFFI.xcframework
          # Drop the raw cargo artifacts so Xcode's file-synced groups don't
          # link the bare static lib in addition to the xcframework.
          rm -rf WorkPlot/AirLift/RustCore/target

      - name: Build unsigned archive
        run: |
          set -o pipefail
          xcodebuild archive \
            -project WorkPlot/WorkPlot.xcodeproj \
            -scheme WorkPlot \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/WorkPlot.xcarchive" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee "$RUNNER_TEMP/xcodebuild.log"

      - name: Upload build log (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: ${{ runner.temp }}/xcodebuild.log

      - name: Package unsigned IPA
        run: |
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R \
            "$RUNNER_TEMP/WorkPlot.xcarchive/Products/Applications/WorkPlot.app" \
            "$RUNNER_TEMP/Payload/"
          cd "$RUNNER_TEMP"
          zip -qry WorkSlop.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: WorkSlop-IPA
          path: ${{ runner.temp }}/WorkSlop.ipa
